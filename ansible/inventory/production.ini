# ===================================================================
# GRID Ansible Inventory — Production Cluster Environment
# ===================================================================

[production_nodes]
prod-app-01.grid.internal ansible_host=10.0.1.10 ansible_user=deployuser ansible_python_interpreter=/usr/bin/python3
prod-app-02.grid.internal ansible_host=10.0.1.11 ansible_user=deployuser ansible_python_interpreter=/usr/bin/python3

[production_db]
prod-db-01.grid.internal ansible_host=10.0.2.20 ansible_user=deployuser ansible_python_interpreter=/usr/bin/python3

[hackathon_servers:children]
production_nodes

[hackathon_servers:vars]
deploy_env=production
app_directory=/opt/hackathon-team-management-system
app_dir=/opt/hackathon-team-management-system
release_tag=1.0.0
app_port=80
host_port=80
server_port=8080
mysql_port=3306
ansible_ssh_common_args='-o StrictHostKeyChecking=no'
