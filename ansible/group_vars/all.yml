# ===================================================================
# GRID Ansible Global Group Variables (all.yml)
# ===================================================================

app_name: hackathon-team-management-system
app_directory: /workspace/hackathon-team-management-system
app_dir: "{{ app_directory }}"
deploy_user: deployuser
deploy_group: deploygroup

# Network Ports
host_port: 8081
server_port: 8080
mysql_internal_port: 3306

# Container Image Tags & Names
image_tag: "1.0.0"
release_tag: "1.0.0"
backend_image: "hackathon-team-management-backend"
frontend_image: "hackathon-team-management-frontend"
docker_registry: ""

# Database Credentials & Volume Preservation (Aligned with docker-compose.yml)
mysql_database: "{{ lookup('env', 'MYSQL_DATABASE') | default('grid_db', true) }}"
mysql_user: "{{ lookup('env', 'MYSQL_USER') | default('grid_user', true) }}"
mysql_password: "{{ lookup('env', 'MYSQL_PASSWORD') | default('grid_pass', true) }}"
mysql_root_password: "{{ lookup('env', 'MYSQL_ROOT_PASSWORD') | default('grid_root_pass', true) }}"
mysql_volume_name: "hackathon_mysql_data"

# Health Verification Settings
health_check_url: "http://localhost:{{ host_port }}/actuator/health"
frontend_check_url: "http://localhost:{{ host_port }}/"
health_check_retries: 25
health_check_delay: 2
