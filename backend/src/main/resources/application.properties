# ===================================================================
# GRID — Application Configuration
# ===================================================================

# Server Port (Configurable, defaults to 8082 to avoid collision with Jenkins on 8080)
server.port=${SERVER_PORT:${APP_PORT:8082}}

# Spring Actuator Configuration
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always

# Database Configuration with Environment Overrides
DB_HOST=${DB_HOST:localhost}
DB_PORT=${DB_PORT:3306}
DB_NAME=${DB_NAME:grid_db}
DB_USERNAME=${DB_USERNAME:grid_user}
DB_PASSWORD=${DB_PASSWORD:grid_pass}

# Default DataSource configuration (supports in-memory H2 MySQL mode for tests / fallback)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:h2:mem:grid_db;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=MySQL}
spring.datasource.driver-class-name=${SPRING_DATASOURCE_DRIVER:org.h2.Driver}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sa}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}

# Flyway Database Migrations
spring.flyway.enabled=${SPRING_FLYWAY_ENABLED:true}
spring.flyway.baseline-on-migrate=true
spring.flyway.locations=classpath:db/migration

# Strict JPA / Hibernate Schema Validation
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# H2 Console (for debugging when H2 is active)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=true

# Seed bootstrap flag
app.bootstrap.seed-data=false
