# ===================================================================
# GRID — MySQL Profile Configuration (Docker Compose & Production)
# ===================================================================

DB_HOST=${DB_HOST:${MYSQL_HOST:localhost}}
DB_PORT=${DB_PORT:${MYSQL_PORT:3306}}
DB_NAME=${DB_NAME:${MYSQL_DATABASE:grid_db}}
DB_USERNAME=${DB_USERNAME:${MYSQL_USER:grid_user}}
DB_PASSWORD=${DB_PASSWORD:${MYSQL_PASSWORD:grid_pass}}

spring.datasource.url=jdbc:mysql://${DB_HOST}:${DB_PORT}/${DB_NAME}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&createDatabaseIfNotExist=true&characterEncoding=UTF-8
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# Flyway Configuration
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.locations=classpath:db/migration

# Strict JPA / Hibernate Schema Validation
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false

spring.h2.console.enabled=false
app.bootstrap.seed-data=false
