# ===================================================================
# Test Profile Configuration (H2 MySQL Mode + Flyway + ddl-auto=validate)
# ===================================================================

server.port=0

spring.datasource.url=jdbc:h2:mem:test_grid_db;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Flyway executes migrations on in-memory database
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.locations=classpath:db/migration

# Strict Hibernate Schema Validation
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false

app.bootstrap.seed-data=false
